<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="32" height="32">
  <!-- Outer ring - dark purple -->
  <circle cx="20" cy="20" r="19" fill="#4A3A79" />
  <!-- Middle ring - medium purple -->
  <circle cx="20" cy="20" r="15" fill="#6F5BB2" />
  <!-- Inner ring - light purple -->
  <circle cx="20" cy="20" r="11" fill="#8C7EDC" />
  <!-- Cyan section -->
  <circle cx="20" cy="20" r="7" fill="#00BFFF" />
  <!-- Center hole -->
  <circle cx="20" cy="20" r="3" fill="white" />
  <!-- Groove lines -->
  <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <circle cx="20" cy="20" r="13" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <circle cx="20" cy="20" r="9" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  <!-- Soundwave -->
  <path d="M30,20 Q32,18 34,20" fill="none" stroke="url(#soundwaveGradient)" stroke-width="1.5" stroke-linecap="round" />
  <defs>
    <linearGradient id="soundwaveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
</svg>